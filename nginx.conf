# Serves the UI and exposes ONLY the REST webhook (no Rasa admin API), with rate limiting.
pid /tmp/nginx.pid;
error_log /dev/stderr;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/fc; uwsgi_temp_path /tmp/uw; scgi_temp_path /tmp/sc;
  limit_req_zone $binary_remote_addr zone=chat:10m rate=5r/s;
  server {
    listen 7860;
    add_header X-Content-Type-Options nosniff;
    location / { root /app/frontend; index index.html; }
    location /webhooks/ {
      limit_req zone=chat burst=10 nodelay;
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:5005;
      proxy_read_timeout 10s;
    }
  }
}
